[project]
name = "rag-solution-poc"
version = "0.1.0"
description = "Confluence RAG/card PoC pipeline with offline fixtures and intranet adapter stubs."
requires-python = ">=3.10,<3.13"
dependencies = [
  "chromadb>=1.5.2",
  "langchain-community<0.4",
  "pyyaml>=6.0",
  "ragas>=0.4.3",
]

[project.scripts]
rag-poc = "backend.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
