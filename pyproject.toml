[project]
name = "rag-solution-poc"
version = "0.1.0"
description = "Confluence RAG/card PoC pipeline with offline fixtures and intranet adapter stubs."
requires-python = ">=3.10,<3.13"
dependencies = [
  "chromadb>=1.5.2",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "langchain-community<0.4",
  "pyyaml>=6.0",
  "ragas>=0.4.3",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
local = [
  "sentence-transformers>=3.0.0",
]
rerank = [
  "sentence-transformers>=3.0.0",
]
pgvector = [
  "pgvector>=0.3.6",
  "psycopg[binary]>=3.2.0",
]

[project.scripts]
rag-poc = "backend.pipeline:main"
rag-poc-web = "backend.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
