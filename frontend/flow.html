<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cards 流程图解 · build & query（真实 MDC 数据）</title>
<style>
:root{
  --bg:#f2f4f1;--panel:#fff;--ink:#18211d;--muted:#6c756f;--line:#dfe5e0;
  --green:#165f46;--green-bright:#20a474;--green-soft:#e8f5ef;
  --gold:#a56e18;--gold-soft:#fbf4e5;--red:#b5473c;--red-soft:#faece9;
  --blue:#176b87;--blue-soft:#e4f2f5;--shadow:0 18px 50px rgba(31,48,39,.09);
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:radial-gradient(circle at 15% 0%,#e3efe9 0,transparent 30%),var(--bg);
  font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;font-size:13.5px;line-height:1.6}
button{font:inherit;cursor:pointer}
code,pre{font-family:Consolas,"SF Mono",monospace}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;min-height:60px;padding:0 24px;
  border-bottom:1px solid rgba(223,229,224,.85);background:rgba(249,250,248,.92);backdrop-filter:blur(14px);flex-wrap:wrap}
.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;color:#fff;background:var(--green);font-size:11px;font-weight:800}
.brand strong{display:block;font-size:14px}.brand small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.tabs{margin-left:auto;display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:11px;background:#eef1ee}
.tab{padding:8px 15px;border:0;border-radius:8px;color:var(--muted);background:transparent;font-weight:700}
.tab.on{color:var(--ink);background:#fff;box-shadow:0 3px 10px rgba(25,45,34,.08)}
main{width:min(1100px,calc(100% - 34px));margin:20px auto 60px}
.intro{padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow)}
.intro h1{margin:0 0 5px;font-size:20px;letter-spacing:-.02em}
.intro p{margin:0;color:#46514a;font-size:12.5px}
.callout{margin-top:9px;padding:9px 12px;border-radius:9px;font-size:11.5px;line-height:1.55}
.callout.blue{background:var(--blue-soft);color:#0f4d61}.callout.gold{background:var(--gold-soft);color:#6e4b16}
.diagram{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fbfcfb;overflow:auto}
.diagram svg{display:block;width:100%;height:auto;max-width:960px;margin:0 auto}
.diagram svg .dhi{fill:rgba(32,164,116,.07);stroke:var(--green-bright);stroke-width:2;stroke-dasharray:7 4;opacity:0;transition:opacity .25s;pointer-events:none}
.diagram .dcap{margin:0 2px 6px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#4f5953}
.layout{display:grid;grid-template-columns:280px 1fr;gap:15px;margin-top:13px;align-items:start}
.rail{display:grid;gap:7px;position:sticky;top:74px}
.node{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:var(--shadow)}
.node:hover{border-color:#b9c6be}.node.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.node .num{flex:0 0 auto;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;color:#fff;background:var(--green);font-size:12px;font-weight:800}
.node.flag .num{background:#9aa39d}.node.human .num{background:var(--gold)}.node.opt .num{background:#9aa39d}
.node .nt{display:block;font-size:12.5px;font-weight:800}.node .nd{display:block;margin-top:1px;color:var(--muted);font-size:10px}
.node .wf{margin-left:auto;color:#9aa39d;font-size:9px}
.detail{border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:#f8faf8;flex-wrap:wrap}
.dh .num{display:grid;place-items:center;width:29px;height:29px;border-radius:50%;color:#fff;background:var(--green);font-weight:800}
.detail.flag .dh .num{background:#9aa39d}.detail.human .dh .num{background:var(--gold)}.detail.opt .dh .num{background:#9aa39d}
.dh h2{margin:0;font-size:16px}
.tag{padding:3px 9px;border-radius:999px;font-size:10px;font-weight:800;text-transform:uppercase}
.tag.page{color:var(--green);background:var(--green-soft)}.tag.global{color:var(--blue);background:var(--blue-soft)}
.tag.human{color:var(--gold);background:var(--gold-soft)}.tag.opt{color:var(--muted);background:#edf2ef}
.subtabs{display:flex;gap:5px;padding:11px 18px 0}
.subtabs button{padding:7px 14px;border:1px solid var(--line);border-radius:8px 8px 0 0;background:#f4f7f5;color:var(--muted);font-weight:700;font-size:12.5px;border-bottom:0}
.subtabs button.on{color:var(--ink);background:#fff}
.db{padding:14px 18px 16px;display:grid;gap:14px;border-top:1px solid var(--line);margin-top:-1px}
.sec h3{margin:0 0 5px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#4f5953}
.sec p{margin:0;color:#33403a;font-size:13.5px;line-height:1.72}
.prodline{font-size:12px;color:var(--muted)}
.prodline code{padding:2px 7px;border-radius:6px;background:#eef2ef;color:#2f4a3d;font-weight:700}
.hint{font-size:11.5px;color:var(--blue);background:var(--blue-soft);padding:7px 10px;border-radius:8px}
.fd{border:1px solid var(--line);border-radius:9px;background:#fbfcfb;overflow:hidden}
.fd+.fd{margin-top:7px}
.fd>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;font-size:12.5px}
.fd>summary::-webkit-details-marker{display:none}
.fd>summary::before{content:"▸";color:#9aa39d;font-size:11px}
.fd[open]>summary::before{content:"▾"}
.fd>summary code{font-weight:800;color:#1f3b2e}
.ty{padding:2px 7px;border-radius:999px;background:#e8eeea;color:#516159;font-size:9.5px;font-weight:800;letter-spacing:.03em}
.ty.enum{background:var(--gold-soft);color:#6e4b16}.ty.num{background:var(--blue-soft);color:#0f4d61}
.fb{padding:0 13px 12px;font-size:12.5px;line-height:1.7;color:#3a443e;display:grid;gap:4px}
.fb b{color:#1f3b2e}
.fb .enums{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.fb .enums span{padding:3px 8px;border-radius:999px;background:#eef2ef;color:#41554b;font-size:11px;font-weight:700}
pre{margin:0;padding:12px 14px;border-radius:10px;background:#0f1714;color:#cfe7da;font-size:11.5px;line-height:1.6;overflow:auto;white-space:pre}
.warn{padding:11px 13px;border-radius:10px;background:var(--red-soft);border:1px solid #e6c1bb}
.warn h3{color:#8a2f25}.warn p{color:#7a2a21}
.ok{padding:9px 13px;border-radius:10px;background:var(--green-soft);color:#155e44;font-size:12px}
.hist{padding:11px 13px;border-radius:10px;background:#f1f5f2;border:1px solid var(--line)}
.hist h3{margin:0 0 4px;font-size:11px;font-weight:800;letter-spacing:.04em;color:#566159}
.hist p{margin:0;color:#4f5953;font-size:12.5px;line-height:1.65}
.hist .done{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:6px;font-size:10px;font-weight:800;color:#155e44;background:var(--green-soft)}
.excap{padding:8px 11px;border-radius:8px;background:var(--gold-soft);color:#6e4b16;font-size:11.5px;line-height:1.55}
.take{padding:10px 12px;border-radius:9px;background:var(--green-soft);color:#155e44;font-size:13px;line-height:1.6}
.nav{display:flex;justify-content:space-between;gap:10px;padding:13px 18px;border-top:1px solid var(--line);background:#fbfcfb}
.nav button{min-height:36px;padding:0 15px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:700}
.nav button.go{border:0;color:#fff;background:var(--green)}.nav button:disabled{opacity:.4;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%}
@media(max-width:840px){.layout{grid-template-columns:1fr}.rail{position:static}}
</style>
</head>
<body>
<header class="topbar">
  <span class="brand-mark">CF</span>
  <span class="brand"><strong>Cards 流程图解</strong><small>build · query · 真实 MDC 词表</small></span>
  <div class="tabs">
    <button class="tab on" data-flow="build" type="button">① 生成 cards</button>
    <button class="tab" data-flow="query" type="button">② 用 cards 问答</button>
  </div>
</header>

  <div style="margin:10px 4px 0;font-size:12px;color:var(--muted,#6b7280)">

    <code>inputs/keyword_table_3725660167.jsonl</code>（page 3725660167 = <b>MDC Project Check List</b>），精确叶子值（URL/SLO 数字/人名）按内网纪律<b>打码</b>，只留结构。
    要跑真问答 → <a href="./index.html">问答页</a>；看卡片结构 → <a href="./cards.html">卡片路径</a>；审批词表 → <a href="./approve.html">词表审批</a>。
  </div>
  <div class="intro" id="intro"></div>
  <div class="layout">
    <div class="rail" id="rail"></div>
    <div>
      <div class="detail" id="detail"></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--green)"></i>常规/逐页</span>
        <span><i class="dot" style="background:var(--blue)"></i>全局/跨页</span>
        <span><i class="dot" style="background:var(--gold)"></i>人工</span>
        <span><i class="dot" style="background:#9aa39d"></i>可选</span>
        <span><i class="dot" style="background:#9aa39d"></i>踩坑记录(已解决)</span>
      </div>
    </div>
  </div>
</main>

      <span class="num">${s.n}</span>
      <span><span class="nt">${s.title}</span><span class="nd">${s.prod}</span></span>
      ${s.problem?`<span class="wf" title="踩坑记录(已解决)">●</span>`:''}
    </button>`).join("");
}
function fieldHtml(fl){
  const isEnum=!!fl.enums, isNum=/number/.test(fl.t);
  const tyCls=isEnum?"enum":(isNum?"num":"");
  return `<details class="fd"><summary><code>${esc(fl.f)}</code> <span class="ty ${tyCls}">${esc(fl.t)}</span></summary>
    <div class="fb">
      <div><b>含义</b>：${fl.m}</div>
      ${fl.enums?`<div><b>取值（枚举）</b><div class="enums">${fl.enums.map(e=>`<span>${esc(e)}</span>`).join("")}</div></div>`:''}
      ${fl.range?`<div><b>取值范围</b>：${esc(fl.range)}</div>`:''}
      ${fl.ex?`<div><b>例</b>：<code>${esc(fl.ex)}</code></div>`:''}
    </div></details>`;
}
function renderDetail(){
  const f=FLOWS[cur.flow], s=f.steps[cur.i];
  const tagCls={page:"page",global:"global",human:"human",opt:"opt"}[s.tag[0]];
  detailEl.className="detail "+s.cls;
  let body="";
  if(cur.view==="explain"){
    body=`<div class="sec"><h3>这步做什么</h3><p>${s.doIt}</p></div>
          <div class="sec"><h3>为什么重要</h3><p>${s.why}</p></div>
          ${s.analogy?`<div class="sec"><h3>打个比方</h3><p>${s.analogy}</p></div>`:''}
          ${s.problem?`<div class="hist"><h3>🗂 踩坑记录</h3><p><span class="done">已解决</span>${s.problem}</p></div>`:`<div class="ok">✓ 这步无历史问题</div>`}`;
  }else if(cur.view==="struct"){
    body=`<div class="prodline">产物文件：<code>${esc(s.prod)}</code></div>
          <div class="hint">👇 点任意字段展开，看它的含义 / 类型 / 取值枚举或范围 / 例子</div>
          <div>${s.fields.map(fieldHtml).join("")}</div>`;
  }else{
    body=`<div class="excap">${f.exTitle}</div>
          <div class="sec"><h3>这一步在例子里发生了什么</h3><p>${s.ex.scenario}</p></div>
          <div class="sec"><h3>得到</h3><pre>${esc(s.ex.code)}</pre></div>
          <div class="take">👉 ${s.ex.take}</div>`;
  }
  detailEl.innerHTML=`
    <div class="dh"><span class="num">${s.n}</span><h2>${s.title}</h2><span class="tag ${tagCls}">${s.tag[1]}</span></div>
    <div class="subtabs">
      <button data-view="explain" class="${cur.view==='explain'?'on':''}" type="button">💡 讲解</button>
      <button data-view="struct"  class="${cur.view==='struct'?'on':''}" type="button">🧩 结构（点开看字段）</button>
      <button data-view="example" class="${cur.view==='example'?'on':''}" type="button">📌 举例</button>
    </div>
    <div class="db">${body}</div>
    <div class="nav">
      <button type="button" id="prev" ${cur.i===0?'disabled':''}>← 上一步</button>
      <button type="button" class="go" id="next" ${cur.i===f.steps.length-1?'disabled':''}>下一步 →</button>
    </div>`;
  detailEl.querySelectorAll(".subtabs button").forEach(b=>b.onclick=()=>{ cur.view=b.dataset.view; renderDetail(); });
  document.getElementById("prev").onclick=()=>{ if(cur.i>0){cur.i--;rerender();} };
  document.getElementById("next").onclick=()=>{ if(cur.i<f.steps.length-1){cur.i++;rerender();} };
}
function highlightDiagram(){
  document.querySelectorAll('#intro .diagram svg .dhi').forEach(r=>{
    r.style.opacity = (String(cur.i)===r.dataset.steps) ? '1' : '0';
  });
}
function rerender(){ renderRail(); renderDetail(); highlightDiagram(); }
railEl.addEventListener("click",e=>{ const b=e.target.closest("[data-i]"); if(!b)return; cur.i=+b.dataset.i; rerender(); });
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));
  cur.flow=t.dataset.flow; cur.i=0; renderIntro(); rerender();
});
renderIntro(); rerender();
</script>
</body>
</html>
