providers:
  confluence: file
  llm: openai_compat
  embedder: local
  store: json

slice:
  root: "06-Delivery/10. Planned Project/2026 Planned Project"

paths:
  fixtures_dir: fixtures/confluence
  golden_seed: fixtures/golden_seed/golden_seed.jsonl
  outputs_dir: outputs
  keyword_table: inputs/keyword_table.jsonl

llm:
  base_url: "https://openai-compatible.example/v1"
  model: "gpt-5.5"
  api_key_env: GPT55_API_KEY
  temperature: 0.0

embedder:
  model: BAAI/bge-m3
  dim: 1024

reranker:
  model: BAAI/bge-reranker-v2-m3

store:
  path: outputs/store/store.json
  chroma_path: outputs/chroma
  dsn: postgresql://postgres:postgres@localhost:5432/rag_poc

retrieval:
  index: both
  search: hybrid
  top_k: 8
  rrf_k: 60
  rerank: true

reduce:
  resolve_aliases: false

eval:
  judge: gpt-5.5
